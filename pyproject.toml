[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-schedule-optimizer"
version = "0.4.0"
description = "Constraint-based scheduling with minimum idle time"
requires-python = ">=3.10"
dependencies = ["ortools>=9.10,<10", "streamlit>=1.35,<2", "plotly>=5.20,<7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
smart-schedule = "scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
